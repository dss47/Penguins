<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penguin — Browse AI Categories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --void: #05010f; --deep: #0c0620; --surface: #130b2e;
  --nv: #a855f7; --nb: #3b82f6; --nc: #06b6d4; --np: #ec4899;
  --ag: #7c3aed; --tp: #f0eaff; --ts: #9d8abf; --tm: #5a4d72;
  --bd: rgba(168,85,247,.12); --bm: rgba(168,85,247,.28);
}
body { font-family:'DM Sans',sans-serif; background:var(--void); color:var(--tp); min-height:100vh; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E"); }

.amb { position:fixed; border-radius:50%; filter:blur(130px); pointer-events:none; z-index:0; }
.a1 { width:650px; height:650px; background:rgba(124,58,237,.15); top:-200px; left:-120px; }
.a2 { width:450px; height:450px; background:rgba(59,130,246,.1); bottom:0; right:-80px; }
.a3 { width:300px; height:300px; background:rgba(236,72,153,.08); top:40%; left:40%; }

.sec { position:relative; z-index:1; max-width:1160px; margin:0 auto; padding:5rem 2rem 5rem; }

.sec-label { display:inline-flex; align-items:center; gap:8px; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--nv); margin-bottom:1rem; font-weight:500; }
.sec-label::before { content:''; width:22px; height:1px; background:var(--nv); }

.sec-title { font-family:'Syne',sans-serif; font-size:clamp(2rem,3.5vw,3rem); font-weight:800; line-height:1.1; letter-spacing:-.025em; margin-bottom:.7rem; }
.grad { background:linear-gradient(90deg,var(--nv),var(--nc)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.sec-sub { font-size:1rem; color:var(--ts); font-weight:300; margin-bottom:2.25rem; }

/* Pills */
.pills { display:flex; flex-wrap:wrap; gap:.625rem; margin-bottom:1.75rem; }
.pill { display:inline-flex; align-items:center; gap:7px; padding:.5rem 1.1rem; border-radius:100px; border:1px solid var(--bd); background:rgba(168,85,247,.05); color:var(--ts); font-family:'DM Sans',sans-serif; font-size:.855rem; cursor:pointer; transition:all .2s; user-select:none; }
.pill:hover { border-color:var(--bm); color:var(--tp); background:rgba(168,85,247,.1); }
.pill.active { border-color:rgba(168,85,247,.45); color:var(--tp); box-shadow:0 0 20px rgba(124,58,237,.18); }
.pill-icon { font-size:1rem; }
.pill-ct { font-size:.7rem; padding:1px 7px; border-radius:100px; background:rgba(168,85,247,.14); color:var(--nv); }

/* Arena */
.arena {
  position:relative; width:100%; min-height:400px;
  border-radius:22px; border:1px solid var(--bd);
  background:rgba(11,5,28,.7); overflow:hidden;
}
.arena::before {
  content:''; position:absolute; inset:0;
  background-image:radial-gradient(rgba(168,85,247,.1) 1px, transparent 1px);
  background-size:30px 30px;
  mask-image:radial-gradient(ellipse 85% 85% at 50% 50%, black 30%, transparent 100%);
  pointer-events:none; z-index:0;
}
.arena-glow {
  position:absolute; width:460px; height:460px; border-radius:50%;
  top:50%; left:50%; transform:translate(-50%,-50%);
  filter:blur(90px); opacity:0; pointer-events:none; z-index:0;
  transition:opacity .6s ease, background-color .4s ease;
}
.arena-glow.visible { opacity:1; }

/* Ripple ring */
@keyframes ripple {
  0%   { width:0; height:0; opacity:.75; border-width:3px; }
  100% { width:500px; height:500px; opacity:0; border-width:1px; }
}
.ripple {
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%); border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  pointer-events:none; z-index:1;
  animation:ripple .75s cubic-bezier(.4,0,.2,1) forwards;
}

/* Hint */
.arena-hint { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.875rem; transition:opacity .35s; z-index:1; }
.arena-hint.hidden { opacity:0; pointer-events:none; }
.hint-arrow { display:flex; align-items:center; gap:.5rem; font-size:.85rem; color:var(--tm); }
.hint-arrow::before, .hint-arrow::after { content:''; flex:1; max-width:40px; height:1px; background:linear-gradient(90deg, transparent, var(--tm)); }
.hint-arrow::after { transform:scaleX(-1); }
.hint-circles { display:flex; gap:12px; }
.hint-c { width:54px; height:54px; border-radius:50%; border:1px solid var(--bd); background:rgba(168,85,247,.05); display:flex; align-items:center; justify-content:center; font-size:1.4rem; opacity:.35; animation:hintBob 3s ease-in-out infinite; }
.hint-c:nth-child(2) { animation-delay:.4s; opacity:.25; }
.hint-c:nth-child(3) { animation-delay:.8s; opacity:.35; }
@keyframes hintBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

/* Tool circle */
.tool-circle {
  position:absolute;
  width:96px; height:96px; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  cursor:pointer;
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  background:rgba(13,7,34,.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  z-index:2;
  transition:border-color .2s, background .2s, box-shadow .2s;
}
.tool-circle:hover { background:rgba(22,12,56,.95); }
.tc-emoji { font-size:2.3rem; line-height:1; pointer-events:none; }
.tc-name { font-size:9px; font-weight:500; color:var(--ts); text-align:center; max-width:82px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:.02em; pointer-events:none; transition:color .2s; }
.tool-circle:hover .tc-name { color:var(--tp); }

/* Tooltip on hover */
.tool-circle::after {
  content: attr(data-name);
  position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
  background:rgba(15,8,38,.97); border:1px solid rgba(168,85,247,.3);
  color:var(--tp); font-size:11px; font-family:'DM Sans',sans-serif; font-weight:500;
  padding:5px 11px; border-radius:8px; white-space:nowrap;
  pointer-events:none; opacity:0; transition:opacity .15s; z-index:20;
}
.tool-circle:hover::after { opacity:1; }

@keyframes floatBob {
  0%,100% { transform:translate(-50%,-50%) scale(1) translateY(0px); }
  50%      { transform:translate(-50%,-50%) scale(1) translateY(-7px); }
}

/* Selected category glow line under pill */
.pill.active::after {
  content:'';
  position:absolute; bottom:-2px; left:20%; right:20%; height:1px;
  border-radius:100px;
}
.pill { position:relative; }

/* stats row at bottom of arena */
.arena-footer {
  position:absolute; bottom:0; left:0; right:0;
  padding:.875rem 1.5rem;
  display:flex; align-items:center; justify-content:space-between;
  border-top:1px solid var(--bd);
  background:rgba(11,5,28,.4);
  backdrop-filter:blur(8px);
  opacity:0; transition:opacity .4s; z-index:3;
}
.arena-footer.visible { opacity:1; }
.af-left { font-size:.82rem; color:var(--ts); }
.af-left span { color:var(--tp); font-weight:500; }
.af-right { display:flex; align-items:center; gap:8px; }
.af-btn { padding:.4rem 1rem; border-radius:100px; border:1px solid var(--bm); background:transparent; color:var(--ts); font-family:'DM Sans',sans-serif; font-size:.78rem; cursor:pointer; transition:all .2s; }
.af-btn:hover { background:rgba(168,85,247,.1); color:var(--tp); border-color:rgba(168,85,247,.45); }
.af-btn.primary { background:linear-gradient(135deg,var(--ag),var(--nb)); border:none; color:#fff; box-shadow:0 0 18px rgba(124,58,237,.3); }
.af-btn.primary:hover { box-shadow:0 0 28px rgba(124,58,237,.5); }

@media (max-width:640px) {
  .tool-circle { width:76px; height:76px; }
  .tc-emoji { font-size:1.8rem; }
  .tc-name { font-size:8.5px; }
  .arena { min-height:340px; }
}
</style>
</head>
<body>

<div class="amb a1"></div>
<div class="amb a2"></div>
<div class="amb a3"></div>

<section class="sec">
  <div class="sec-label">Browse by category</div>
  <h2 class="sec-title">Discover tools by <span class="grad">what you need</span></h2>
  <p class="sec-sub">Click any category — the top AI tools burst into view.</p>

  <div class="pills" id="pillsRow"></div>

  <div class="arena" id="arena">
    <div class="arena-glow" id="arenaGlow"></div>

    <div class="arena-hint" id="arenaHint">
      <div class="hint-circles">
        <div class="hint-c">🤖</div>
        <div class="hint-c">🎨</div>
        <div class="hint-c">✍️</div>
      </div>
      <div class="hint-arrow">Click a category above</div>
    </div>

    <div class="arena-footer" id="arenaFooter">
      <div class="af-left"><span id="footerName">–</span> &mdash; <span id="footerCount">0</span> tools total</div>
      <div class="af-right">
        <button class="af-btn" onclick="saveAll()">🤍 Save all</button>
        <button class="af-btn primary" id="viewAllBtn">View all →</button>
      </div>
    </div>
  </div>
</section>

<script>
const CATS = [
  {
    id:'writing', label:'Writing', icon:'✍️', count:214,
    glow:'rgba(168,85,247,.22)', border:'rgba(168,85,247,.55)',
    tools:[
      {n:'Jasper',e:'✍️'},{n:'Copy.ai',e:'📝'},{n:'Writesonic',e:'🖊️'},
      {n:'Notion AI',e:'📔'},{n:'Grammarly',e:'✅'},{n:'Hemingway',e:'📖'},
      {n:'Rytr',e:'🔤'},{n:'Wordtune',e:'💬'},{n:'Sudowrite',e:'🎭'},{n:'QuillBot',e:'🪶'},
    ]
  },
  {
    id:'image', label:'Image', icon:'🎨', count:187,
    glow:'rgba(236,72,153,.2)', border:'rgba(236,72,153,.55)',
    tools:[
      {n:'Midjourney',e:'🎨'},{n:'DALL·E 3',e:'🖼️'},{n:'Stable Diff.',e:'🌌'},
      {n:'Firefly',e:'✨'},{n:'NightCafe',e:'🌙'},{n:'Leonardo AI',e:'🦁'},
      {n:'Playground',e:'🎮'},{n:'BlueWillow',e:'💙'},{n:'Ideogram',e:'💡'},{n:'Canva AI',e:'🖌️'},
    ]
  },
  {
    id:'voice', label:'Voice', icon:'🎤', count:143,
    glow:'rgba(6,182,212,.2)', border:'rgba(6,182,212,.55)',
    tools:[
      {n:'ElevenLabs',e:'🎤'},{n:'Murf AI',e:'🎙️'},{n:'Suno AI',e:'🎵'},
      {n:'Otter.ai',e:'📝'},{n:'Resemble',e:'🔊'},{n:'Play.ht',e:'▶️'},
      {n:'Lovo AI',e:'🎚️'},{n:'Speechify',e:'📢'},{n:'Soundraw',e:'🎼'},{n:'Descript',e:'✂️'},
    ]
  },
  {
    id:'code', label:'Code', icon:'💻', count:198,
    glow:'rgba(59,130,246,.2)', border:'rgba(59,130,246,.55)',
    tools:[
      {n:'Copilot',e:'💻'},{n:'Claude Code',e:'🤖'},{n:'Cursor',e:'⚡'},
      {n:'Tabnine',e:'🔧'},{n:'Codeium',e:'🛠️'},{n:'Replit AI',e:'🔁'},
      {n:'Phind',e:'🔍'},{n:'Continue',e:'➡️'},{n:'Sourcegraph',e:'🗺️'},{n:'CodeWhisperer',e:'🌬️'},
    ]
  },
  {
    id:'video', label:'Video', icon:'📹', count:112,
    glow:'rgba(234,179,8,.18)', border:'rgba(234,179,8,.5)',
    tools:[
      {n:'Runway ML',e:'📹'},{n:'Pika Labs',e:'🎬'},{n:'Synthesia',e:'🎥'},
      {n:'HeyGen',e:'👤'},{n:'Lumen5',e:'📺'},{n:'Pictory',e:'🖼️'},
      {n:'InVideo AI',e:'🎞️'},{n:'Steve AI',e:'⭐'},{n:'Kaiber',e:'🌀'},{n:'Descript',e:'✂️'},
    ]
  },
  {
    id:'data', label:'Data', icon:'📊', count:96,
    glow:'rgba(34,197,94,.18)', border:'rgba(34,197,94,.5)',
    tools:[
      {n:'Julius AI',e:'📊'},{n:'Perplexity',e:'🔍'},{n:'Obviously AI',e:'📈'},
      {n:'Polymer',e:'🧮'},{n:'Tableau AI',e:'📉'},{n:'Akkio',e:'🤖'},
      {n:'Rows AI',e:'📋'},{n:'Numerous AI',e:'🔢'},{n:'MindsDB',e:'🧠'},{n:'H2O.ai',e:'💧'},
    ]
  },
  {
    id:'chat', label:'Chatbots', icon:'🤖', count:231,
    glow:'rgba(124,58,237,.22)', border:'rgba(124,58,237,.55)',
    tools:[
      {n:'Claude',e:'🤖'},{n:'ChatGPT',e:'💬'},{n:'Gemini',e:'🔮'},
      {n:'Llama 3',e:'🦙'},{n:'Mistral',e:'💨'},{n:'Grok',e:'⚡'},
      {n:'Pi',e:'🥧'},{n:'Character AI',e:'🎭'},{n:'Cohere',e:'🌐'},{n:'Perplexity',e:'🔍'},
    ]
  },
  {
    id:'search', label:'Search', icon:'🔍', count:88,
    glow:'rgba(6,182,212,.18)', border:'rgba(6,182,212,.5)',
    tools:[
      {n:'Perplexity',e:'🔍'},{n:'You.com',e:'🌐'},{n:'Consensus',e:'📚'},
      {n:'Elicit',e:'🧐'},{n:'Semantic Scholar',e:'🎓'},{n:'ResearchRabbit',e:'🐰'},
      {n:'SciSpace',e:'🚀'},{n:'Scholarcy',e:'📄'},{n:'Iris AI',e:'👁️'},{n:'Genei',e:'🧬'},
    ]
  },
];

// 10 positions: 2 rows of 5, offset pattern
const BASE_POS = [
  {x:10,y:30},{x:27,y:25},{x:44,y:31},{x:61,y:25},{x:78,y:30},
  {x:18,y:67},{x:35,y:72},{x:52,y:66},{x:70,y:72},{x:87,y:67},
];

let activeCat = null;
let circles = [];

function buildPills() {
  const row = document.getElementById('pillsRow');
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.id = 'pill-' + cat.id;
    btn.innerHTML = `<span class="pill-icon">${cat.icon}</span>${cat.label}<span class="pill-ct">${cat.count}</span>`;
    btn.onclick = () => selectCat(cat.id);
    row.appendChild(btn);
  });
}

function fireRipple() {
  const arena = document.getElementById('arena');
  const r = document.createElement('div');
  r.className = 'ripple';
  arena.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
}

function clearCircles(onDone) {
  if (circles.length === 0) { onDone && onDone(); return; }
  circles.forEach((c, i) => {
    setTimeout(() => {
      c.style.transition = 'transform .22s cubic-bezier(.55,0,1,.45), opacity .2s ease';
      c.style.transform = 'translate(-50%,-50%) scale(0)';
      c.style.opacity = '0';
      c.style.animation = 'none';
    }, i * 20);
  });
  setTimeout(() => {
    circles.forEach(c => c.remove());
    circles = [];
    onDone && onDone();
  }, circles.length * 20 + 260);
}

function spawnCircles(cat) {
  const arena = document.getElementById('arena');
  const hint = document.getElementById('arenaHint');
  const glow = document.getElementById('arenaGlow');
  const footer = document.getElementById('arenaFooter');

  hint.classList.add('hidden');
  footer.classList.add('visible');
  document.getElementById('footerName').textContent = cat.label;
  document.getElementById('footerCount').textContent = cat.count;
  document.getElementById('viewAllBtn').onclick = () => {
    sendPromptSafe('Show me all tools in ' + cat.label + ' category');
  };

  glow.style.backgroundColor = cat.glow;
  glow.classList.add('visible');
  fireRipple();

  cat.tools.forEach((tool, i) => {
    const pos = BASE_POS[i];
    // Add small per-circle random jitter (±3%)
    const jx = (Math.random() - .5) * 6;
    const jy = (Math.random() - .5) * 8;
    const tx = pos.x + jx;
    const ty = pos.y + jy;

    const el = document.createElement('div');
    el.className = 'tool-circle';
    el.setAttribute('data-name', tool.n);
    el.style.left = tx + '%';
    el.style.top = ty + '%';
    el.style.transform = 'translate(-50%,-50%) scale(0)';
    el.style.opacity = '0';
    el.style.border = `1px solid ${cat.border}`;
    el.style.boxShadow = `0 0 0 0 ${cat.border}`;
    el.innerHTML = `<div class="tc-emoji">${tool.e}</div><div class="tc-name">${tool.n}</div>`;

    // Hover glow
    el.addEventListener('mouseenter', () => {
      el.style.boxShadow = `0 0 22px ${cat.border}, 0 0 40px rgba(0,0,0,.5)`;
    });
    el.addEventListener('mouseleave', () => {
      el.style.boxShadow = '0 0 0 0 transparent';
    });

    arena.appendChild(el);
    circles.push(el);

    // Staggered burst in
    const delay = 40 + i * 65;
    setTimeout(() => {
      el.style.transition = `left .5s cubic-bezier(.34,1.56,.64,1) ${delay*.15}ms,
                              top .5s cubic-bezier(.34,1.56,.64,1) ${delay*.15}ms,
                              transform .55s cubic-bezier(.34,1.56,.64,1),
                              opacity .3s ease`;
      el.style.transform = 'translate(-50%,-50%) scale(1)';
      el.style.opacity = '1';

      // Start floating after burst settles
      setTimeout(() => {
        const floatDur = 3 + Math.random() * 2;
        const floatDelay = Math.random() * 2;
        el.style.animation = `floatBob ${floatDur.toFixed(1)}s ${floatDelay.toFixed(1)}s ease-in-out infinite`;
        el.style.transition = 'border-color .2s, background .2s, box-shadow .2s';
      }, 700);

    }, delay);
  });
}

function selectCat(id) {
  if (activeCat === id) return;
  const cat = CATS.find(c => c.id === id);
  if (!cat) return;

  // Update pill styles
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  const activePill = document.getElementById('pill-' + id);
  if (activePill) {
    activePill.classList.add('active');
    activePill.style.background = cat.glow;
    activePill.style.borderColor = cat.border;
    // Reset other pills
    document.querySelectorAll('.pill:not(.active)').forEach(p => {
      p.style.background = '';
      p.style.borderColor = '';
    });
  }

  // Also reset glow color on previous active
  const glow = document.getElementById('arenaGlow');
  if (activeCat) {
    glow.style.opacity = '0';
    setTimeout(() => {
      glow.style.backgroundColor = cat.glow;
      glow.style.opacity = '1';
    }, 200);
  }

  activeCat = id;
  clearCircles(() => spawnCircles(cat));
}

function saveAll() {
  if (activeCat) {
    const cat = CATS.find(c => c.id === activeCat);
    alert('Saved all ' + cat.label + ' tools to your shelf! (Demo)');
  }
}

function sendPromptSafe(text) {
  if (typeof sendPrompt === 'function') sendPrompt(text);
}

buildPills();
</script>
</body>
</html>
